name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agrocifra
          POSTGRES_PASSWORD: agrocifra
          POSTGRES_DB: agrocifra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrocifra"
          --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests
      - name: Validate migrations on PostgreSQL (alembic upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://agrocifra:agrocifra@localhost:5432/agrocifra_test
          SECRET_KEY: test-secret
        run: alembic upgrade head
      - name: Tests (pytest, incl. E2E)
        working-directory: backend
        env:
          SECRET_KEY: test-secret
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install & build
        working-directory: frontend
        env:
          VITE_API_BASE: /api
        run: |
          npm ci || npm install
          npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t agrocifra-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t agrocifra-frontend:ci --build-arg VITE_API_BASE=/api ./frontend
      - name: Validate docker-compose
        run: docker compose config >/dev/null
