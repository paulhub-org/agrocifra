# АгроЦифра — развёртывание на одном сервере (Docker Compose).
# Перед запуском: cp .env.example .env и заполните секреты. Затем: docker compose up -d --build
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrocifra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrocifra}
      POSTGRES_DB: ${POSTGRES_DB:-agrocifra}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agrocifra} -d ${POSTGRES_DB:-agrocifra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Откройте порт только для администрирования БД при необходимости:
    # ports: ["127.0.0.1:5432:5432"]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agrocifra}:${POSTGRES_PASSWORD:-agrocifra}@db:5432/${POSTGRES_DB:-agrocifra}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Прямой доступ к API/Swagger при необходимости:
    # ports: ["127.0.0.1:8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports: ["80:80"]   # публичная точка входа (веб-интерфейс + проксирование /api)

volumes:
  pgdata:
